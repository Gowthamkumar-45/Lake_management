# Render Blueprint for the Lake Management System
# Deploys: a managed Postgres DB, the Django API, and the React static site.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: lake-management-db
    plan: free
    databaseName: lake_management
    user: lake_management

services:
  # ---------- Django REST API ----------
  - type: web
    name: lake-management-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate &&
      python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lake-management-db
          property: connectionString
      # Allow the static frontend to call this API.
      - key: CORS_ALLOWED_ORIGINS
        value: https://lake-management-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://lake-management-web.onrender.com

  # ---------- React static frontend ----------
  - type: web
    name: lake-management-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Point the React build at the deployed API.
      - key: REACT_APP_API_URL
        value: https://lake-management-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
